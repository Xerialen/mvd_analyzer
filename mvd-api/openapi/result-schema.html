<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mvdanalyzer-api &mdash; Result schema</title>
  <script src="/docs/marked.min.js"></script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0 auto; padding: 2rem 1.5rem 6rem; max-width: 60rem;
      background: #1f2226; color: #ccc;
      font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    a { color: #6fb3e0; text-decoration: none; }
    a:hover { text-decoration: underline; }
    h1, h2, h3, h4 { color: #eee; line-height: 1.25; margin-top: 2em; }
    h1 { font-size: 1.9rem; } h2 { font-size: 1.45rem; border-bottom: 1px solid #333; padding-bottom: .3rem; }
    code {
      background: #2a2e33; border-radius: 3px; padding: .1em .35em;
      font: .88em/1.5 ui-monospace, "SF Mono", Consolas, monospace; color: #e4e9ee;
    }
    pre { background: #26292e; border: 1px solid #333; border-radius: 5px; padding: .8rem 1rem; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    table { border-collapse: collapse; margin: 1rem 0; display: block; overflow-x: auto; }
    th, td { border: 1px solid #3a3f45; padding: .35rem .6rem; text-align: left; vertical-align: top; }
    th { background: #2a2e33; color: #eee; }
    blockquote { border-left: 3px solid #444; margin: 1rem 0; padding: .1rem 1rem; color: #aaa; }

</head>
<body>
  <p class="topnav"><a href="/docs">&larr; API reference</a> &middot; <a href="/docs/result-schema.md">raw markdown</a></p>
  <div id="status">Loading&hellip;</div>
  <main id="content"></main>
  <script>
    // GitHub-style slugs so RESULT_SCHEMA.md's own #anchors resolve.
    function slug(text, seen) {
      let s = text.toLowerCase().trim()
        .replace(/<[^>]*>/g, "")
        .replace(/[^\p{L}\p{N} _-]/gu, "")
        .replace(/ /g, "-");
      if (seen[s] !== undefined) { seen[s]++; s = s + "-" + seen[s]; } else { seen[s] = 0; }
      return s;
    }
    fetch("/docs/result-schema.md")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(md => {
        document.getElementById("content").innerHTML = marked.parse(md);
        const seen = {};
        for (const h of document.querySelectorAll("h1,h2,h3,h4,h5,h6")) {
          h.id = slug(h.textContent, seen);
        }
        // Repo-relative links (source files, sibling docs) cannot resolve
        // on this origin — point them at the repo instead.
        const repoBase = "https://github.com/galfthan/mvd_analyzer/blob/main/mvd-analytics/";
        for (const a of document.querySelectorAll("#content a[href]")) {
          const href = a.getAttribute("href");
          if (/^(#|\/|https?:)/.test(href)) continue;
          a.href = new URL(href, repoBase).href;
        }
        document.getElementById("status").remove();
        if (location.hash) {
          const t = document.getElementById(location.hash.slice(1));
          if (t) t.scrollIntoView();
        }
      })
      .catch(e => { document.getElementById("status").textContent = "Failed to load: " + e; });
  </script>
</body>
</html>
