                  - vy
                  - vz
                type:
                  - "null"
                  - object
              view:
                additionalProperties: false
                properties:
                  vp:
                    maximum: 32767
                    minimum: -32768
                    type: integer
                  vya:
                    maximum: 32767
                    minimum: -32768
                    type: integer
                required:
                  - vp
                  - vya
                type:
                  - "null"
                  - object
            type: object
          type:
            - object
            - "null"
        t:
          type: number
      required:
        - t
        - players
      type: object
    LocTrails:
      additionalProperties: false
      properties:
        players:
          items:
            additionalProperties: false
            properties:
              name:
                type: string
              sequence:
                items:
                  additionalProperties: false
                  properties:
                    e:
                      type: number
                    li:
                      maximum: 32767
                      minimum: -32768
                      type:
                        - "null"
                        - integer
                    loc:
                      type: string
                    s:
                      type: number
                  required:
                    - s
                    - e
                  type: object
                type:
                  - "null"
                  - array
            required:
              - name
              - sequence
            type: object
          type:
            - "null"
            - array
      required:
        - players
      type: object
    MapGeometry:
      additionalProperties: false
      properties:
        bounds:
          additionalProperties: false
          properties:
            maxX:
              type: number
            maxY:
              type: number
            minX:
              type: number
            minY:
              type: number
          required:
            - minX
            - maxX
            - minY
            - maxY
          type: object
        liquids:
          items:
            additionalProperties: false
            properties:
              kind:
                type: string
              tris:
                items:
                  type: number
                type:
                  - "null"
                  - array
            required:
              - kind
              - tris
            type: object
          type:
            - "null"
            - array
        locs:
          items:
            additionalProperties: false
            properties:
              name:
                type: string
              tris:
                items:
                  type: number
                type:
                  - "null"
                  - array
              z:
                type: number
            required:
              - name
              - z
              - tris
            type: object
          type:
            - "null"
            - array
        map:
          type: string
        pruned:
          additionalProperties: false
          properties:
            demos:
              type: integer
            facesDropped:
              type: integer
            points:
              type: integer
          required:
            - demos
            - points
            - facesDropped
          type:
            - "null"
            - object
        submodels:
          items:
            additionalProperties: false
            properties:
              id:
                type: integer
              tris:
                items:
                  type: number
                type:
                  - "null"
                  - array
            required:
              - id
              - tris
            type: object
          type:
            - "null"
            - array
        version:
          type: integer
        walls:
          items:
            type: number
          type:
            - "null"
            - array
      required:
        - map
        - version
        - bounds
        - locs
      type: object
    # --- Wrappers over the generated struct schemas: bare-array bodies,
    # layout/summary unions, single-key stream envelopes, and the generic
    # artifact envelope union.
    Chat:
      type: array
      description: >
        /chat body — chat events, verbatim result.MatchEvent entries
        (time is int32 ms). [] when nothing matches.
      items: { $ref: "#/components/schemas/MatchEvent" }
    Backpacks:
      type: array
      description: /backpacks body — RL/LG backpack drops; [] when none.
      items: { $ref: "#/components/schemas/BackpackDrop" }
    WeaponPickups:
      type: array
      description: /weapon-pickups body — slot-weapon acquisitions; [] when none.
      items: { $ref: "#/components/schemas/WeaponPickup" }
    Airgibs:
      type: array
      description: >
        /airgibs body — airgib key moments sorted by height descending;
        [] on BSP-less maps.
      items: { $ref: "#/components/schemas/AirgibEvent" }
    Items:
      description: >
        /items body — per-item phase timelines, or per-item take
        aggregates when summary is set.
      anyOf: # not oneOf: an empty {"items": []} matches both branches
        - $ref: "#/components/schemas/ItemsTimelines"
        - $ref: "#/components/schemas/ItemsSummary"
    Buckets:
      description: >
        /buckets body — the compact columnar grid (layout=column, the
        default) or row objects (layout=row).
      oneOf:
        - $ref: "#/components/schemas/BucketsColumnar"
        - $ref: "#/components/schemas/BucketsRow"
    Los:
      type: object
      description: >
        /los body (and the lazy `los` artifact) — per-player LOS/PVS
        interval sets. `los`/`pvs` are omitted for a player with no
        sightlines and empty on maps without a provisioned BSP.
      required: [players]
      additionalProperties: false
      properties:
        players:
          type: array
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              name: { type: string }
              los:
                type: array
                items: { $ref: "#/components/schemas/LosTrack" }
              pvs:
                type: array
                items: { $ref: "#/components/schemas/LosTrack" }
    Projectiles:
      type: object
      required: [projectiles]
      additionalProperties: false
      properties:
        projectiles:
          description: Rocket/grenade flight stream; null when the demo has none.
          oneOf:
            - $ref: "#/components/schemas/ProjectileStreams"
            - type: "null"
    Beams:
      type: object
      required: [beams]
      additionalProperties: false
      properties:
        beams:
          description: LG bolt stream; null when the demo has none.
          oneOf:
            - $ref: "#/components/schemas/BeamStreams"
            - type: "null"
    Nails:
      type: object
      required: [nails]
      additionalProperties: false
      properties:
        nails:
          description: Nail flight stream; null when the demo has none.
          oneOf:
            - $ref: "#/components/schemas/ProjectileStreams"
            - type: "null"
    LocTable:
      type: object
      required: [locTable]
      additionalProperties: false
      properties:
        locTable:
          type: array
          description: Interned loc names; index 0 is the "" no-loc sentinel.
          items: { type: string }
    Graph:
      type: object
      description: The analyzer DAG — analyzer.ExportGraph("json").
      required: [nodes, edges]
      additionalProperties: false
      properties:
        nodes:
          type: [array, "null"]
          items:
            type: object
            required: [name, requires, provides, mutates, lazy, depth, cost, resultKey]
            additionalProperties: false
            properties:
              name: { type: string }
              requires:
                type: [array, "null"]
                items: { type: string }
              provides:
                type: [array, "null"]
                items: { type: string }
              mutates: { type: boolean }
              lazy: { type: boolean }
              depth: { type: integer }
              cost:
                type: string
                enum: [light, heavy]
              resultKey: { type: string }
        edges:
          type: [array, "null"]
          items:
            type: object
            required: [from, to, artifact]
            additionalProperties: false
            properties:
              from: { type: string }
              to: { type: string }
              artifact: { type: string }
    ArtifactEnvelope:
      description: >
        GET /v1/demos/{id}/artifacts/{name} body — a single-key envelope
        keyed by the artifact's resultKey (see GET /v1/artifacts; the key
        is NOT the node name — e.g. node `frag` serves `{"frags": …}`).
        Raw list/object sections (match, messages, timeline, items,
        map-entities, backpacks, weapon-pickups) may be null at 200 for
        demos without the signal; capability-gated artifacts return their
        422 code instead. The lazy `los` artifact serves the /los body
        shape (no resultKey).
      oneOf:
        - type: object
          required: [demoInfo]
          additionalProperties: false
          properties:
            demoInfo: { $ref: "#/components/schemas/DemoInfo" }
        - type: object
          required: [frags]
          additionalProperties: false
          properties:
            frags: { $ref: "#/components/schemas/Frags" }
        - type: object
          required: [metadata]
          additionalProperties: false
          properties:
            metadata: { $ref: "#/components/schemas/Metadata" }
        - type: object
          required: [damage]
          additionalProperties: false
          properties:
            damage: { $ref: "#/components/schemas/Damage" }
        - type: object
          required: [shots]
          additionalProperties: false
          properties:
            shots: { $ref: "#/components/schemas/Shots" }
        - type: object
          required: [aim]
          additionalProperties: false
          properties:
            aim: { $ref: "#/components/schemas/Aim" }
        - type: object
          required: [locGraph]
          additionalProperties: false
          properties:
            locGraph: { $ref: "#/components/schemas/LocGraph" }
        - type: object
          required: [opening]
          additionalProperties: false
          properties:
            opening: { $ref: "#/components/schemas/Opening" }
        - type: object
          required: [match]
          additionalProperties: false
          properties:
            match:
              oneOf:
                - $ref: "#/components/schemas/Match"
                - type: "null"
        - type: object
          required: [messages]
          additionalProperties: false
          properties:
            messages:
              oneOf:
                - $ref: "#/components/schemas/Messages"
                - type: "null"
        - type: object
          required: [timelineAnalysis]
          additionalProperties: false
          properties:
            timelineAnalysis:
              oneOf:
                - $ref: "#/components/schemas/TimelineAnalysis"
                - type: "null"
        - type: object
          required: [items]
          additionalProperties: false
          properties:
            items:
              oneOf:
                - $ref: "#/components/schemas/ItemsTimelines"
                - type: "null"
        - type: object
          required: [mapEntities]
          additionalProperties: false
          properties:
            mapEntities:
              oneOf:
                - $ref: "#/components/schemas/MapEntities"
                - type: "null"
        - type: object
          required: [backpacks]
          additionalProperties: false
          properties:
            backpacks:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/BackpackDrop" }
        - type: object
          required: [weaponPickups]
          additionalProperties: false
          properties:
            weaponPickups:
              type: [array, "null"]
              items: { $ref: "#/components/schemas/WeaponPickup" }
        - $ref: "#/components/schemas/Los"
