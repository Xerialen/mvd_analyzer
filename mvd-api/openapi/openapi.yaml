        fromCache: { type: boolean }
        schemaVersion: { type: integer }
    ArtifactsManifest:
      type: object
      required: [schemaVersion, artifacts]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/ArtifactMeta" }
    ArtifactMeta:
      type: object
      description: One analyzer DAG node, as listed in ARTIFACTS.md.
      required: [name, mutates, lazy, cost, servable]
      additionalProperties: false
      properties:
        name: { type: string, description: DAG node name. }
        requires:
          type: [array, "null"]
          items: { type: string }
        provides:
          type: [array, "null"]
          items: { type: string }
        mutates: { type: boolean }
        lazy: { type: boolean }
        cost:
          type: string
