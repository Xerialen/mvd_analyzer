        - $ref: "#/components/parameters/Kinds"
      responses:
        "200":
          description: The entity list.
          headers: &mapStaticHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapEntities" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MapUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/maps/{map}/geometry:
    get:
      operationId: getMapGeometry
      tags: [maps]
      summary: Per-map floor-polygon geometry
      description: >
        Streams the per-map floor-polygon geometry JSON (large; REST-only,
        no MCP tool). 404 `map_unavailable` when geometry is not
        provisioned on this server or unknown for the map. ETag
        `"geo-<map>-<size>"`.
      parameters:
        - $ref: "#/components/parameters/MapName"
      responses:
        "200":
          description: The geometry document.
          headers: *mapStaticHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapGeometry" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/MapUnavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
components:
  securitySchemes:
    bearerKey:
      type: http
      scheme: bearer
      description: >
        API key as `Authorization: Bearer <key>`. Required only when the
        server runs in auth mode (the hosted deployment); localhost /
        no-auth mode accepts every request and treats the header as an
        unvalidated source label for the access log. Exempt even in auth
        mode: /healthz, /v1/version, /openapi.yaml, /docs.
  parameters:
    DemoId:
      name: id
      in: path
      required: true
      description: >
        Demo identity: `gameId:N` (a hub.quakeworld.nu game id, positive
        integer) or `sha:HEX` (lowercase-insensitive 64-hex SHA-256 of the
        demo file). Every per-demo endpoint auto-resolves and auto-loads
        on cache miss.
      schema:
        type: string
        pattern: "^(gameId:[0-9]+|sha:[0-9a-fA-F]{64})$"
      examples:
        byGameId: { value: "gameId:12345" }
        bySha: { value: "sha:9f3aa7b2c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f" }
    ArtifactName:
      name: name
      in: path
      required: true
      description: >
        DAG node name of a servable artifact (see GET /v1/artifacts).
        Note the body key of the response is the artifact's `resultKey`,
        which may differ from this name.
      schema:
        type: string
        enum:
          # artifact-enum:begin — pinned to analyzer.ArtifactManifest() (servable only) by TestOpenAPIArtifactEnumCurrent
          - demoinfo
          - frag
          - metadata
          - match
          - messages
          - timeline
          - items
          - damage
          - shots
          - map-entities
          - backpacks
          - weapon-pickups
          - aim
          - loc-graph
          - opening
          - los
          # artifact-enum:end
    MapName:
      name: map
      in: path
      required: true
      description: Map name, e.g. `dm3` (normalized server-side).
      schema: { type: string }
    From:
      name: from
      in: query
      description: >
        Window start, match-relative SECONDS (float). 0 / omitted = no
        lower bound. Endpoints treat the window as inclusive on both ends.
      schema: { type: number, minimum: 0 }
    To:
      name: to
      in: query
      description: >
        Window end, match-relative SECONDS (float). 0 / omitted = no
        upper bound.
      schema: { type: number, minimum: 0 }
    Players:
      name: players
      in: query
      description: >
        CSV of player display names. Case-SENSITIVE (QW names are
        case-significant). Omit for all players. Filter semantics are
        per-endpoint (e.g. killer-or-victim on /frags, speaker on /chat).
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Weapons:
      name: weapon
      in: query
      description: >
        CSV of weapon codes (case-insensitive). Codes: rl, lg, gl, ssg,
        sng, ng, sg, axe (plus tele/stomp where positional kills apply —
        see API.md). /backpacks accepts rl/lg only; /weapon-pickups
        rl,lg,gl,ssg,sng,ng.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Summary:
      name: summary
      in: query
      description: >
        `1`/`true` drops the big per-event log / sample arrays / phase
        timeline and returns only the aggregates.
      schema: { type: boolean }
    ItemsFilter:
      name: items
      in: query
      description: >
        CSV restricting to items whose Name or Kind matches
        (case-insensitive). A kind token matches every instance ("ya" →
        ya_1, ya_2); an instance name ("ya_1") matches one.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Kinds:
      name: kinds
      in: query
      description: >
        CSV of item categories — armor, mega, health, powerup, weapon,
        ammo — or raw kind tokens (ra, quad). Case-insensitive.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Source:
      name: source
      in: query
      description: Restrict weapon pickups by provenance.
      schema:
        type: string
        enum: [world, backpack, unknown]
    ChatTypes:
      name: types
      in: query
      description: >
        CSV of message types; defaults to `chat,teamsay`. Pass a subset to
        narrow.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    EventTypes:
      name: types
      in: query
      description: >
        CSV of event types (frag, spawn, pickup, powerup, streak, chat, …
        — see API.md §events for the full list). Omit for the default set.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    EntityTypes:
      name: types
      in: query
      description: >
        CSV of entity types: item, spawn, teleportDst, teleportSrc,
        button, door.
      style: form
      explode: false
      schema:
        type: array
        items: { type: string }
    Fields:
      name: fields
      in: query
      description: >
        CSV of field selector codes. Omit for the default set (everything
        except the opt-in view/hgt/lq/vel). NOTE: the selector code `li`
        renders as output key `loc` in name mode — `loc` is NOT a selector
        code. Unknown codes 400 with the full vocabulary enumerated.
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            # field-code-enum:begin — pinned to view/fields.go by TestOpenAPIFieldCodesCurrent
            - h
            - a
            - at
            - li
            - pos
            - view
            - hgt
            - lq
            - vel
            - rl
            - lg
            - gl
            - ssg
            - sng
            - q
            - pe
            - r
            - sh
            - nl
            - rk
            - cl
            - sp
            - d
            # field-code-enum:end
    Loc:
      name: loc
      in: query
      description: >
        Loc rendering — `name` (default) resolves loc indices to names;
        `index` returns raw LocTable indices (decode via /loc-table).
      schema:
        type: string
        enum: [name, index]
    Layout:
      name: layout
      in: query
      description: >
        /buckets response layout — `column` (default, compact columnar
        grid) or `row` (row objects).
      schema:
        type: string
        enum: [column, row]
    Reducers:
      name: reducers
      in: query
      description: >
        CSV of `field=reducerName` pairs overriding the per-field default
        reducer, e.g. `reducers=h=min,a=last`. Names come from the reducer
        registry in RESULT_SCHEMA.md.
      schema: { type: string }
    IncludeTeam:
      name: includeTeam
      in: query
      description: Include each player's team in the bucket envelope.
      schema: { type: boolean }
    WindowMs:
      name: windowMs
      in: query
      description: >
        Window size, integer MILLISECONDS. ⚠️ Defaults to 50 ms — on a
        20-minute match that is ~24,000 windows per field per player.
        Always pass a windowMs sized to your question. Note the unit split
        within one call: windowMs is ms while from/to are seconds.
      schema:
        type: integer
        default: 50
        minimum: 1
    MinDwellMs:
      name: minDwellMs
      in: query
      description: Drop loc residences shorter than this many milliseconds.
      schema:
        type: integer
        minimum: 0
    TimeRequired:
      name: time
      in: query
      required: true
      description: The instant to sample, match-relative SECONDS (float).
      schema: { type: number }
  headers:
    ETag:
      description: >
        Strong validator. Per-demo `"<sha>-v<schemaVersion>"`; per-artifact
        `"<sha>-<name>@v<n>"`; binary-static `"<kind>-v<n>"`; map-static
        `"ents-<map>-v<n>"` / `"geo-<map>-<size>"`; spec/docs content hash.
      schema: { type: string }
    XCache:
      description: Which cache tier served the demo — HIT, WARM, or MISS.
      schema:
        type: string
        enum: [HIT, WARM, MISS]
    XSchemaVersion:
      description: result.CurrentSchemaVersion of the serving binary.
      schema: { type: string }
    XRequestId:
      description: >
        Per-request id echoed in the server access log; quote it when
        reporting a problem.
      schema: { type: string }
  responses:
    NotModified:
      description: >
        Not Modified — the If-None-Match validator matched; the cached
        representation is current.
    BadRequest:
      description: >
        Malformed `{id}` (`invalid_demo_id`), malformed or rejected query
        parameter (`invalid_param`), or required parameter absent
        (`missing_param`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: >
        Auth mode only — missing / invalid / revoked API key
        (`unauthorized`). Carries `WWW-Authenticate: Bearer`. The body is
        deliberately generic.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    DemoNotFound:
      description: The hub has no row for this gameId (`demo_not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    MapUnavailable:
      description: >
        No entity corpus / geometry for this map (`map_unavailable`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: >
        The demo structurally lacks the signal this section needs
        (`<section>_unavailable` — the operation description names the
        specific code). Expected for some demos; treat as "panel
        unavailable", not failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: >
        Auth mode only — per-key rate limit exceeded (`rate_limited`).
        Carries `Retry-After` (seconds); wait and retry.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    HubUpstream:
      description: Network error / 5xx from the hub (`hub_upstream`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Internal:
      description: >
        Unexpected server error (`internal`). The body is generic — a
        fixed message plus the request id; the real error is logged
        server-side keyed by X-Request-Id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      description: Stable error envelope for every non-2xx JSON response.
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code: { $ref: "#/components/schemas/ErrorCode" }
            message:
              type: string
              description: >
                Human-readable and user-actionable for 4xx; generic (request
                id only) for 5xx.
    ErrorCode:
      type: string
      description: Machine-readable error class.
      enum:
        # error-code-enum:begin — pinned to the writeError/writeUnavailable call sites by TestOpenAPIErrorCodesCurrent
        - aim_unavailable
        - airgibs_unavailable
        - artifact_unknown
        - damage_unavailable
        - demo_not_found
        - demoinfo_unavailable
        - frags_unavailable
        - hub_upstream
        - internal
        - invalid_demo_id
        - invalid_param
        - locgraph_unavailable
        - map_unavailable
        - metadata_unavailable
        - missing_param
        - opening_unavailable
        - rate_limited
        - region_control_unavailable
        - shots_unavailable
        - unauthorized
        # error-code-enum:end
    Health:
      type: object
      required: [ok, schemaVersion]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        schemaVersion: { type: integer }
    Version:
      type: object
      required: [hash, tag, buildDate]
      additionalProperties: false
      properties:
        hash: { type: string, description: Git commit hash of the build. }
        tag: { type: string, description: Git tag, if any. }
        buildDate: { type: string }
    LoadResult:
      type: object
      required: [demoId, sha256, fromCache, schemaVersion]
      additionalProperties: false
      properties:
        demoId:
          type: string
          description: Canonical `sha:HEX` id — use it for subsequent calls.
        sha256: { type: string }
        fromCache: { type: boolean }
        schemaVersion: { type: integer }
    ArtifactsManifest:
      type: object
      required: [schemaVersion, artifacts]
      additionalProperties: false
      properties:
        schemaVersion: { type: integer }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/ArtifactMeta" }
    ArtifactMeta:
      type: object
      description: One analyzer DAG node, as listed in ARTIFACTS.md.
      required: [name, mutates, lazy, cost, servable]
      additionalProperties: false
      properties:
        name: { type: string, description: DAG node name. }
        requires:
          type: [array, "null"]
          items: { type: string }
        provides:
          type: [array, "null"]
          items: { type: string }
        mutates: { type: boolean }
        lazy: { type: boolean }
        cost:
          type: string
          enum: [light, heavy]
        resultKey:
          type: string
          description: >
            Top-level Result JSON key (the generic artifact endpoint's body
            key). Empty = internal / no direct section.
        servable: { type: boolean }
        description: { type: string }
    Graph:
      type: object
      description: >
        The analyzer DAG — analyzer.ExportGraph("json"). Deep shape:
        mvd-analytics/ARTIFACTS.md.
    # --- Per-endpoint response schemas.
    # Placeholder depth (phase 16.2 commit 1); the full field-level pass
    # replaces these in the same phase. Semantics: RESULT_SCHEMA.md.
    Overview:
      type: object
      description: Curated match summary. Shape: RESULT_SCHEMA.md + API.md §4.2.
    DemoInfo:
      type: object
      description: KTX demoinfo pass-through. Shape: RESULT_SCHEMA.md §demoInfo.
    Metadata:
      type: object
      description: Server cvars + KTX match settings. Shape: RESULT_SCHEMA.md §metadata.
    Frags:
      type: object
      description: Frag aggregates + kill log. Shape: RESULT_SCHEMA.md §frags.
    Damage:
      type: object
      description: Damage log + aggregates. Shape: RESULT_SCHEMA.md §damage.
    Shots:
      type: object
      description: Per-fire weapon stream. Shape: RESULT_SCHEMA.md §shots.
    Aim:
      type: object
      description: Per-player aim analysis. Shape: RESULT_SCHEMA.md §aim.
    LocGraph:
      type: object
      description: Loc adjacency graph. Shape: RESULT_SCHEMA.md §locGraph.
    Chat:
      type: object
      description: Chat events. Shape mirrors result.MatchEvent.
    Backpacks:
      type: object
      description: Backpack drops. Shape: RESULT_SCHEMA.md §backpacks.
    Items:
      type: object
      description: >
        Item phase timelines, or per-item aggregates with `summary`.
        Shape: RESULT_SCHEMA.md §items.
    WeaponPickups:
      type: object
      description: Slot-weapon acquisitions. Shape: RESULT_SCHEMA.md §weaponPickups.
    Buckets:
      type: object
      description: >
        Bucketed series — columnar grid (layout=column) or row objects
        (layout=row). Shape: RESULT_SCHEMA.md §buckets.
    Events:
      type: object
      description: Unified event list; `detail` is polymorphic per type.
    StreamSlice:
      type: object
      description: Raw stream slices. Shape: RESULT_SCHEMA.md §streams.
    StateAt:
      type: object
      description: Per-player point-in-time state.
    Los:
      type: object
      description: Per-player LOS/PVS interval sets.
    Projectiles:
      type: object
      description: '`{"projectiles": …}` — rocket/grenade flight stream, null when none.'
    Beams:
      type: object
      description: '`{"beams": …}` — LG bolt stream, null when none.'
    Nails:
      type: object
      description: '`{"nails": …}` — nail flight stream, null when none.'
    LocTrails:
      type: object
      description: Per-player loc dwell spans.
    LocTable:
      type: object
      description: '`{"locTable": [...]}` — interned loc names; index 0 is the no-loc sentinel.'
    RegionControl:
      type: object
      description: Region-control timeline. Shape: RESULT_SCHEMA.md §regionControl.
    Airgibs:
      type: object
      description: Airgib key moments list.
    MapEntities:
      type: object
      description: Static map entity layout. Shape: RESULT_SCHEMA.md §mapEntities.
    MapGeometry:
      type: object
      description: Floor-polygon geometry document (mapgeom.MapRegions v2).
    ArtifactEnvelope:
      type: object
      description: >
        Single-key envelope — the key is the artifact's `resultKey` (see
        GET /v1/artifacts), the value the raw Result section.
      minProperties: 1
      maxProperties: 1
      additionalProperties: true
