    BucketsColumnar:
      type: object
      description: >
        Column-major buckets (layout=column, the default). The time axis is
        implicit: time(i) = startMs + i*windowMs (int32 ms). Each player
        object inlines its dense columns at the top level keyed by field
        code; boolean columns (and the alive mask) serialize as 0/1.
      required: [windowMs, startMs, count]
      additionalProperties: false
      properties:
        windowMs: { type: integer }
        startMs: { type: integer }
        count: { type: integer }
        partialLastMs:
          type: integer
          description: Shorter end of the final bucket when the match length is not a multiple of windowMs.
        locTable:
          type: array
          description: >
            Legend for the raw li columns — the demo's interned loc-name
            table (index 0 is the "" no-loc sentinel; identical to
            /loc-table). Present iff an li column is in the output, so
            columnar responses decode locally without a /loc-table call
            (v53).
          items: { type: string }
        players:
          type: object
          additionalProperties:
            type: object
            description: >
              One player's dense columns over their active span
              [first, first+n). Reserved keys first/n/alive/validFrom;
              every other key is a requested field-code column (or a
              position/view sub-column like x/y/z, vp/vya, vx/vy/vz) of
              length n — numeric, string (at), or 0/1 series.
            required: [first, n, alive]
            properties:
              first: { type: integer }
              n: { type: integer }
              alive:
                type: array
                items: { type: integer, minimum: 0, maximum: 1 }
              validFrom:
                type: object
                description: >
                  Absolute bucket index from which a late-starting column
                  is valid; leading slots hold a typed zero and must be
                  treated as absent.
                additionalProperties: { type: integer }
            additionalProperties:
              type: array
              items:
                type: [number, string]
        teams:
          type: object
          additionalProperties:
            type: object
            description: >
              One team's per-bucket aggregate counters as dense integer
              columns of length count, keyed by counter name; armor-by-type
              sub-columns nest under abt.
            properties:
              abt:
                type: object
                additionalProperties:
                  type: array
                  items: { type: integer }
            additionalProperties:
              type: array
              items: { type: integer }
