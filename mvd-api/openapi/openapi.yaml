# mvd-api — OpenAPI 3.1 description of the REST surface.
#
# FORMATTING IS LOAD-BEARING. mvd-api/openapi_test.go scans this file
# line-wise:
#   - path items are "  /path:" (2-space indent), methods "    get:" (4-space);
#   - the marker comments (artifact-enum, error-code-enum, field-code-enum)
#     delimit enum blocks pinned to the code;
#   - info.version must equal result.CurrentSchemaVersion.
# Keep those conventions when editing, or the drift tests will fail loudly.
#
# Response shapes are authored from mvd-analytics/RESULT_SCHEMA.md (the
# authoritative field-level reference) and the view/result structs, and are
# validated against real golden-corpus responses by openapi_validate_test.go.
# mvd-api/API.md remains the prose integration guide (recipes, semantics).
openapi: 3.1.0
info:
  title: mvd-api
  version: "53"
  summary: QuakeWorld MVD demo analysis REST API
  description: |
    REST host for the mvd-analyzer pipeline: point it at a demo
    (`gameId:N` from hub.quakeworld.nu, or `sha:HEX` of the demo file) and
    read curated analysis sections — frags, damage, aim, item timelines,
    positional streams — as JSON.

    ### Time units — the one real gotcha
    Query inputs `from` / `to` / `time` are match-relative **seconds**
    (float). View-synthesised outputs (event lists, window bounds, trail
    dwell spans, row-bucket timestamps) are **seconds**; anything copied
    verbatim from the stored schema (change-stream / interval / position
    arrays, the columnar bucket grid, `/overview` times) is **int32
    milliseconds**. Scale ms→s by `* 0.001`. See API.md §2.1.

    ### Caching
    Per-demo 2xx responses carry `Cache-Control: public, max-age=86400,
    immutable` and an `ETag` of the form `"<sha>-v<schemaVersion>"`
    (per-artifact: `"<sha>-<name>@v<n>"`; binary-statics: `"<kind>-v<n>"`).
    A demo's analysis never changes for a given schema version — cache
    aggressively and revalidate with `If-None-Match` for cheap 304s.

    ### Availability — the 422 rule
    Object-shaped sections that need a demo capability return
    `422 <section>_unavailable` when the demo structurally lacks the signal
    (non-KTX server, no position track, …). Treat these as "panel
    unavailable for this demo", not failures. Always-computable list
    sections (`/items`, `/backpacks`, `/weapon-pickups`, `/chat`) return
    200 with an empty body instead.

    ### Parameter conventions
    Query parameter **names** are case-insensitive (canonical spelling is
    camelCase). CSV parameters are comma-separated lists. Player-name
    values are case-sensitive (QW names are case-significant); weapon /
    item / kind / loc / layout tokens are case-insensitive.

    Full prose reference: mvd-api/API.md. Field-level payload shapes:
    mvd-analytics/RESULT_SCHEMA.md.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same origin — correct for localhost and the hosted deployment alike.
security:
  - bearerKey: []
tags:
  - name: meta
    description: Liveness, build stamp, auth check, this spec.
  - name: demo
    description: Demo identity, warm-up, and curated summaries.
  - name: combat
    description: Frags, damage, shots, aim.
  - name: items
    description: Item spawners, backpacks, weapon pickups.
  - name: timeline
    description: Unified events, chat, region control, key moments.
  - name: positional
    description: Position-derived views — buckets, slices, state-at, trails, LOS.
  - name: streams
    description: Raw projectile / beam / nail flight streams.
  - name: artifacts
    description: The analyzer DAG surface — manifest, graph, generic artifact accessor.
  - name: maps
    description: Per-map static data (no demo needed).
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [meta]
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      tags: [meta]
      summary: This document
      description: >
        The OpenAPI 3.1 description of this server, embedded in the binary.
        ETag is a content hash; revalidate with If-None-Match.
      security: []
      responses:
        "200":
          description: The spec.
          content:
            application/yaml:
              schema: { type: string }
        "304": { $ref: "#/components/responses/NotModified" }
  /docs:
    get:
      operationId: getDocsPage
      tags: [meta]
      summary: Browsable API reference
      description: >
        Interactive reference for this spec (vendored RapiDoc; no external
        requests). Point a browser here.
      security: []
      responses:
        "200":
          description: The viewer page.
          content:
            text/html:
              schema: { type: string }
        "304": { $ref: "#/components/responses/NotModified" }
  /v1/version:
    get:
      operationId: getVersion
      tags: [meta]
      summary: Build stamp
      security: []
      responses:
        "200":
          description: Build identity of the running binary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Version" }
  /v1/auth/check:
    get:
      operationId: checkAuthKey
      tags: [meta]
      summary: Validate the presented API key
      description: >
        204 when the Bearer key is valid. Deliberately NOT auth-exempt —
        this route is the check itself. In no-auth (localhost) mode it
        always succeeds.
      responses:
        "204":
          description: Key accepted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/artifacts:
    get:
      operationId: listArtifacts
      tags: [artifacts]
      summary: Analyzer DAG artifact manifest
      description: >
        Every DAG node (name, requires, provides, mutates, lazy, cost,
        resultKey, servable, description). Static per binary; ETag
        `"artifacts-v<schemaVersion>"`.
      responses:
        "200":
          description: The manifest.
          headers: &staticHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtifactsManifest" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/graph:
    get:
      operationId: getGraph
      tags: [artifacts]
      summary: Analyzer DAG as JSON
      description: >
        Nodes (cost / resultKey / lazy) + artifact edges, exactly
        `analyzer.ExportGraph("json")`. Static per binary; ETag
        `"graph-v<schemaVersion>"`.
      responses:
        "200":
          description: The graph.
          headers: *staticHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Graph" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/demos/{id}:
    post:
      operationId: loadDemo
      tags: [demo]
      summary: Warm the cache for a demo (idempotent)
      description: >
        Resolves + parses the demo into the cache and returns identity
        metadata. Optional: every per-demo GET auto-loads on cache miss —
        use this only to warm up or to learn the SHA behind a gameId.
        Non-cacheable action: no Cache-Control/ETag on the response.
      parameters:
        - $ref: "#/components/parameters/DemoId"
      responses:
        "200":
          description: Demo identity + cache state.
          headers:
            X-Cache: { $ref: "#/components/headers/XCache" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoadResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/overview:
    get:
      operationId: getOverview
      tags: [demo]
      summary: Curated match summary
      description: >
        Map, teams, corrected scoreboard, top streaks, top powerup runs,
        timing, data-quality `errors[]`. UNITS SEAM: overview times are
        int32 MILLISECONDS (verbatim from the stored schema). `teams` and
        `players` are frag-sorted descending — index 0 is the winner.
      parameters:
        - $ref: "#/components/parameters/DemoId"
      responses:
        "200":
          description: The overview.
          headers: &perDemoHeaders
            ETag: { $ref: "#/components/headers/ETag" }
            X-Cache: { $ref: "#/components/headers/XCache" }
            X-Schema-Version: { $ref: "#/components/headers/XSchemaVersion" }
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/demoinfo:
    get:
      operationId: getDemoInfo
      tags: [demo]
      summary: KTX demoinfo block (verbatim pass-through)
      description: >
        Per-player weapon accuracy, kills/deaths, damage, sprees, item
        pickup counts, RL/LG transfers — exactly as KTX reported them.
        KTX UNITS ISLAND: integer seconds on KTX's own clock; `timelimit`
        is minutes; item `{took, time}` is count + cumulative-hold seconds.
        Unavailable (422 `demoinfo_unavailable`) on non-KTX servers or
        pre-match aborts.
      parameters:
        - $ref: "#/components/parameters/DemoId"
      responses:
        "200":
          description: The KTX demoinfo section.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoInfo" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/metadata:
    get:
      operationId: getMetadata
      tags: [demo]
      summary: Server cvars + KTX match settings
      description: >
        Full serverinfo cvars plus parsed match settings (timelimit,
        fraglimit, antilag, midair, …). 422 `metadata_unavailable` when the
        demo has no fullserverinfo / countdown centerprint.
      parameters:
        - $ref: "#/components/parameters/DemoId"
      responses:
        "200":
          description: The metadata section.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Metadata" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/frags:
    get:
      operationId: getFrags
      tags: [combat]
      summary: Frag aggregates + kill log
      description: >
        Top-level frag aggregates plus the full kill log. When any scoping
        filter (players / weapon / from / to) is active, ALL aggregates are
        recomputed from the filtered log so they stay consistent with the
        entries shown. 422 `frags_unavailable` when the demo has no frag log.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/WeaponsLegacy"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Summary"
      responses:
        "200":
          description: Aggregates + kill log (log omitted with `summary`).
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Frags" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/damage:
    get:
      operationId: getDamage
      tags: [combat]
      summary: Damage log + aggregates
      description: >
        Per-hit damage log plus aggregates (matrix, per-weapon, given/taken)
        and the KTX-scoreboard cross-check. Positional kills — telefrags and
        stomps — are excluded from all damage figures and listed separately.
        Filters recompute aggregates like /frags. 422 `damage_unavailable`
        without the KTX mvdhidden_dmgdone stream.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/WeaponsLegacy"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Summary"
      responses:
        "200":
          description: Aggregates + per-hit log (log omitted with `summary`).
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Damage" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/shots:
    get:
      operationId: getShots
      tags: [combat]
      summary: Per-fire weapon stream
      description: >
        Every detected weapon fire with time/player/weapon/source, hit +
        victims where linkable, per-player aggregates, and the KTX
        reconciliation cross-check. No query parameters. 422
        `shots_unavailable` when no weapon fires were decoded.
      parameters:
        - $ref: "#/components/parameters/DemoId"
      responses:
        "200":
          description: The shots section.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shots" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/aim:
    get:
      operationId: getAim
      tags: [combat]
      summary: Per-player aim analysis
      description: >
        Per-weapon effectiveness (SG/SSG pellet stats, RL/GL direct/splash,
        the LG near/blocked/out-of-range whiff split), columnar
        crosshair-error samples, and the LG ramp series. A from/to window
        recomputes aim over the shots in that window; `summary` drops the
        big crosshair/lgRamp blocks. 422 `aim_unavailable` without shots +
        position/view streams.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Summary"
      responses:
        "200":
          description: The aim section (columnar blocks omitted with `summary`).
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Aim" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/loc-graph:
    get:
      operationId: getLocGraph
      tags: [positional]
      summary: Per-map loc adjacency graph
      description: >
        Which locs are reachable from which, weighted by observed traversal.
        422 `locgraph_unavailable` when no position track was emitted.
      parameters:
        - $ref: "#/components/parameters/DemoId"
      responses:
        "200":
          description: The loc graph.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocGraph" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "422": { $ref: "#/components/responses/Unavailable" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/chat:
    get:
      operationId: getChat
      tags: [timeline]
      summary: Chat-only event slice
      description: >
        Chat messages with speaker/team, mirrored from result.MatchEvent
        (Time, Type, Player, Team, Message, MessageClean). Always 200 —
        empty list when nothing matches.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/ChatTypes"
      responses:
        "200":
          description: Matching chat events.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/backpacks:
    get:
      operationId: getBackpacks
      tags: [items]
      summary: RL/LG backpack drops
      description: >
        Backpack drops from KTX's drop hint: time, dropper, weapon
        (rl/lg), origin XYZ, resolved loc, and the server ent number that
        joins to /weapon-pickups. Always 200 — empty when none.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/WeaponsLegacy"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Matching backpack drops.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backpacks" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/items:
    get:
      operationId: getItems
      tags: [items]
      summary: Per-item pickup/respawn timeline
      description: >
        One entry per tracked spawner (unique name like `ya_1`, kind token,
        world position + nearest loc) with its phase timeline
        (availableFrom, takenBy/takenAt, respawnAt). `from`/`to` keep
        phases OVERLAPPING the window; `summary` returns per-item take
        aggregates (takenCount, byPlayer, firstTake) instead of phases.
        Warmup pickups rebase to negative times; `availableFrom: 0` means
        "available since match start". Always 200 — empty when none.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/ItemsFilter"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Kinds"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Summary"
      responses:
        "200":
          description: Item timelines, or per-item aggregates with `summary`.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Items" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/weapon-pickups:
    get:
      operationId: getWeaponPickups
      tags: [items]
      summary: Slot-weapon acquisitions + effectiveness
      description: >
        Every slot-weapon acquisition (world spawners + RL/LG backpacks)
        with kills-before-next-death effectiveness. Backpack pickups carry
        the dropper and the ent number joining to /backpacks. Always 200 —
        empty when none.
      parameters:
        - $ref: "#/components/parameters/DemoId"
        - $ref: "#/components/parameters/Players"
        - $ref: "#/components/parameters/Weapons"
        - $ref: "#/components/parameters/WeaponsLegacy"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Matching pickups.
          headers: *perDemoHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeaponPickups" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DemoNotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "502": { $ref: "#/components/responses/HubUpstream" }
  /v1/demos/{id}/buckets:
    get:
      operationId: getBuckets
      tags: [positional]
      summary: Time-bucketed position/stat samples
      description: >
        Per-player field series reduced into fixed windows. ⚠️ `windowMs`
        defaults to 50 ms — on a 20-minute match that is ~24,000 windows
        per field per player; always pass a windowMs sized to your
        question. `layout=column` (default) returns the compact columnar
        grid (int32 ms axis); `layout=row` returns row objects (float
        seconds `t`).
      parameters:
        - $ref: "#/components/parameters/DemoId"
