{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuakeWorld MVD Analytics — API access</title>
<style>
:root {
  --bg: #14161a;
  --panel: #1c1f26;
  --border: #2b2f38;
  --fg: #e6e8eb;
  --muted: #9aa2ad;
  --accent: #5865f2;
  --accent-hover: #4752c4;
  --danger: #e0574a;
  --code-bg: #0e1013;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  background: var(--bg);
  color: var(--fg);
  line-height: 1.5;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 4rem;
}
h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
h2 { font-size: 1.1rem; margin: 1.75rem 0 0.5rem; }
p { color: var(--fg); }
.muted { color: var(--muted); }
a { color: var(--accent); }
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem 1.5rem;
  margin: 1.25rem 0;
}
.btn {
  display: inline-block;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1.1rem;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
}
.btn:hover { background: var(--accent-hover); }
.btn.danger { background: var(--danger); }
.btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--fg); }
form { display: inline; margin: 0; }
code, .key {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
}
code { padding: 0.1rem 0.35rem; font-size: 0.9em; }
.key {
  display: block;
  padding: 0.9rem 1rem;
  margin: 0.75rem 0;
  word-break: break-all;
  font-size: 0.95rem;
  overflow-x: auto;
}
.warn {
  border-left: 3px solid var(--danger);
  padding-left: 0.9rem;
  color: var(--fg);
}
.footer { margin-top: 3rem; font-size: 0.85rem; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.25rem 1rem; margin: 0.5rem 0; }
dt { color: var(--muted); }
dd { margin: 0; }
</style>
</head>
<body>
<main>
{{end}}

{{define "foot"}}
<div class="footer muted">
  <a href="/portal">Portal home</a> · QuakeWorld MVD Analytics ·
  <a href="/portal/privacy">Privacy</a> · <a href="/portal/terms">Terms</a>
</div>
</main>
</body>
</html>
{{end}}
