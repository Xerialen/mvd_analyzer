# tmux preferences for the mvd-analyzer dev container.
# Preferences only — no identity or secrets.

set -g prefix C-z

unbind %
bind | split-window -h
bind - split-window -v

bind -n C-Left previous-window
bind -n C-Right next-window
bind -n C-Up select-pane -t :.-
bind -n C-Down select-pane -t :.+

# Colour: assume a 256-colour terminal and pass truecolour through to apps.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Keep program output in the normal buffer (no alternate screen) so it stays
# in scrollback.
set -ga terminal-overrides "xterm*:smcup@:rmcup@"

set -g status-bg yellow
